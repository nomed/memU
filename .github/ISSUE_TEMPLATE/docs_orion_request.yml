name: Docs Request (Orion)
description: Free-form documentation request for Orion (`docs.agent.md`)
title: "[DOCS] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Free-form docs request for Orion (`.github/agents/docs.agent.md`).

        Notes (optional):
        - Default target is `kw/` unless you want `docs/` or `README.md`
        - Diataxis is preferred (`tutorial`, `howto`, `reference`, `explanation`)

  - type: textarea
    id: request
    attributes:
      label: Request
      description: Describe what you want documented or updated
      placeholder: |
        Explain what should be written/updated and why.
        You can include target path, audience, examples to add, and any constraints.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References (optional)
      description: Files, docs, issues, PRs, or commits Orion should look at
      placeholder: |
        docs/architecture.md
        src/memu/app/retrieve.py
        PR #123
    validations:
      required: false

  - type: input
    id: target_path
    attributes:
      label: Target path (optional)
      description: Leave blank if Orion should decide (default preference: `kw/`)
      placeholder: "kw/retrieve/rag-vs-llm.md"
    validations:
      required: false
